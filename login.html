<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f5f5f5;

      background-image: url('images/perpus.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .form-box {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, .1);
      width: 320px;
    }

    .form-box h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .input-group {
      position: relative;
      margin-bottom: 20px;
    }

    .input-group input {
      width: 100%;
      padding: 14px 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      outline: none;
      font-size: 16px;
    }

    /* Trik 1 –Focus Ring & Smooth  */

    .input-group input:focus {
      border-color: dodgerblue;
    }

    .input-group label {
      position: absolute;
      left: 10px;
      top: 14px;
      background: white;
      padding: 0 5px;
      color: #888;
      transition: .3s;
      pointer-events: none;
    }

    /* Trik 2- Floating Label */

    .input-group input:focus+label,
    .input-group input:not(:placeholder-shown)+label {
      top: -10px;
      font-size: 12px;
      color: dodgerblue;
    }


    button {
      width: 100%;
      padding: 12px;
      border: none;
      background: dodgerblue;
      color: white;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }
  </style>
</head>

<body>

  <div class="form-box">
    <center>
     <img src="images/logo.png" width="80" class="logo">
     </center>
    <h2>pendaftaran perpustakaan</h2>

    <form action="https://script.google.com/macros/s/AKfycbzmS7Xa8aNllaYruswADu4_9OFEkMQD7Ij02wAI3v0NdZOw15SK32842_UPsA67q9Ot/exec" method="POST">
      <div class="input-group">
        <input type="text" name="nama"placeholder=" ">
        <label>Nama Lengkap </label>
      </div>

      <div class="input-group">
        <input type="text" name="kelas" placeholder=" ">
        <label>Kelas</label>
      </div>

      <div class="input-group">
        <input type="email" name="email" placeholder=" ">
        <label>Email</label>
      </div>

      <button type="submit">Daftar</button>
    </form>
  </div>

   <footer> 
    <SMP Bina Qurani IBS>
  </footer>

</body>

</html>
